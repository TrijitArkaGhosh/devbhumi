# Render Blueprint: one free web service that runs the zero-install DevBhumi server (Python standard library only).
# Secrets are generated by Render on first deploy and live only in Render's Environment settings, never in this repo.
services:
  - type: web
    name: devbhumi
    runtime: python
    plan: free
    region: singapore          # closest Render region to West Bengal
    buildCommand: "echo 'No packages needed: the demo server uses only the Python standard library.'"
    startCommand: "cd backend && python dev_server.py"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DEVBHUMI_DEMO_HINTS        # 0 = sign-in screens do not show demo codes
        value: "0"
      - key: DEVBHUMI_BADGE_SECRET      # signs every badge link; print badges only after this is set
        generateValue: true
      - key: ADMIN_TOKEN                # district team: badge printing
        generateValue: true
      - key: MITRA_TOKEN_KALNA          # Pathik Mitra Arup (Kalna)
        generateValue: true
      - key: MITRA_TOKEN_BARDHAMAN      # Pathik Mitra Riya (Bardhaman)
        generateValue: true
      - key: DEVBHUMI_BASE_URL          # the live https address, e.g. https://devbhumi.onrender.com
        sync: false
      - key: DEVBHUMI_INTERPRETER_PHONE # optional: on-duty interpreter line, e.g. +91XXXXXXXXXX
        sync: false
      # Real WhatsApp (Meta WhatsApp Cloud API). Leave empty until Meta is set up; the in-site WhatsApp demo works without them.
      - key: DEVBHUMI_WA_NUMBER         # digits only, e.g. 15551234567
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
